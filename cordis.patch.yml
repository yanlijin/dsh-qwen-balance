# dsh-qwen-balance bundle patch: inserts this plugin's row into the web plugin
# roster. The single row mounts BOTH halves: the host side (balance/coupon
# probes and the /api/dsh-qwen-balance routes) and the browser side (the
# sidebar foot card, served from this package's lib/client.js).
- insert:
    - id: qwen-balance
      name: 'dsh-qwen-balance'